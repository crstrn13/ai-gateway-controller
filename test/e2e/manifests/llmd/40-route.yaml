# The GIE routing under test (RHAIGW-468): istio Gateway routes straight to the
# InferencePool, consulting the EPP per request. This is the unproven arrow — the
# EPP + pool below are praxis's known-good components; this HTTPRoute is the new bit.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llmd-route
  namespace: llmd
spec:
  parentRefs:
    - name: ai-gateway
      namespace: istio-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: pool-a
