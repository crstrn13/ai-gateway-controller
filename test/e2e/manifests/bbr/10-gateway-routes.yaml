# BBR scenario gateway + routes. The HTTPRoute matches on X-Gateway-Model-Name,
# which the BBR ext-proc promotes from the request body `model` field. A request
# carrying {"model":"granite-8b"} and NO header must still reach internal-model —
# that is the BBR proof. An unmatched model has no rule, so it 404s.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-routes
  namespace: llm
spec:
  parentRefs:
    - name: ai-gateway
      namespace: istio-system
  rules:
    - matches:
        - headers:
            - name: X-Gateway-Model-Name
              type: Exact
              value: granite-8b
      backendRefs:
        - name: internal-model
          port: 8080
