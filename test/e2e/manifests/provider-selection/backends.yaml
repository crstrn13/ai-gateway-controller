# Two self-identifying recorder backends for weighted provider-selection tests.
# Each stamps its PROVIDER_NAME (prov-a / prov-b) into every response's "provider"
# field, so attribution is exact regardless of model rewriting. Built from
# test/e2e/sim/recorder and loaded into kind by the product dependency stack.
# They live in the `llm` namespace from the suite-level manifests/backends stack.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-a-sim
  namespace: llm
  labels: {app: provider-a-sim}
spec:
  replicas: 1
  selector:
    matchLabels: {app: provider-a-sim}
  template:
    metadata:
      labels: {app: provider-a-sim}
    spec:
      containers:
        - name: recorder
          image: ai-gateway-e2e/provider-recorder:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: PROVIDER_NAME, value: prov-a}
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: provider-a-sim
  namespace: llm
  labels: {app: provider-a-sim}
spec:
  selector: {app: provider-a-sim}
  ports:
    - {port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-b-sim
  namespace: llm
  labels: {app: provider-b-sim}
spec:
  replicas: 1
  selector:
    matchLabels: {app: provider-b-sim}
  template:
    metadata:
      labels: {app: provider-b-sim}
    spec:
      containers:
        - name: recorder
          image: ai-gateway-e2e/provider-recorder:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: PROVIDER_NAME, value: prov-b}
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: provider-b-sim
  namespace: llm
  labels: {app: provider-b-sim}
spec:
  selector: {app: provider-b-sim}
  ports:
    - {port: 8080, targetPort: 8080}
