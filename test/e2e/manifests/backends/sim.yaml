# BBR scenario backend: an in-cluster model the gateway can route to.
# llm-d-inference-sim answers OpenAI/Anthropic shapes without GPUs or weights.
apiVersion: v1
kind: Namespace
metadata:
  name: llm
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-model
  namespace: llm
  labels:
    app: internal-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-model
  template:
    metadata:
      labels:
        app: internal-model
    spec:
      containers:
        - name: vllm-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
          imagePullPolicy: IfNotPresent
          args: ["--model", "granite-8b", "--port", "8080", "--mode", "echo"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: internal-model
  namespace: llm
  labels:
    app: internal-model
spec:
  selector:
    app: internal-model
  ports:
    - port: 8080
      targetPort: 8080
